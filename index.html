<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>پروژه ایگل</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Tahoma, sans-serif; margin: 0; padding: 16px;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      direction: rtl;
    }
    h2 { text-align: center; color: var(--tg-theme-button-color, #229ED9); margin-bottom: 20px; }
    h3 { color: var(--tg-theme-button-color, #229ED9); margin: 22px 0 10px; font-size: 15px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
    .info-box { background: var(--tg-theme-secondary-bg-color, #f1f5f9); border-radius: 10px; padding: 12px; margin-bottom: 16px; font-size: 13px; line-height: 1.8; }
    label { display: block; margin-top: 14px; margin-bottom: 6px; font-size: 14px; font-weight: bold; }
    input, select, textarea {
      width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px;
      font-size: 15px; font-family: inherit;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    textarea { min-height: 80px; resize: vertical; }
    button {
      width: 100%; margin-top: 22px; padding: 14px; border: none; border-radius: 10px;
      background: var(--tg-theme-button-color, #229ED9);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-size: 16px; font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    .btn-secondary { background: var(--tg-theme-secondary-bg-color, #e2e8f0); color: var(--tg-theme-text-color, #000); margin-bottom: 12px; }
    .message { margin-top: 16px; padding: 12px; border-radius: 10px; text-align: center; font-size: 14px; white-space: pre-line; }
    .msg-success { background: #d1fae5; color: #065f46; }
    .msg-error { background: #fee2e2; color: #991b1b; }
    .msg-info { background: #dbeafe; color: #1e40af; }
    .msg-warning { background: #fef3c7; color: #92400e; }
    .hidden { display: none; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
    .badge-active { background: #d1fae5; color: #065f46; }
    .badge-inactive { background: #fee2e2; color: #991b1b; }
    .badge-access { background: #dbeafe; color: #1e40af; }

    .date-row { display: flex; gap: 8px; }
    .date-row .col { flex: 1; }
    .date-row .col.month { flex: 1.6; }
    .date-row select {
      text-align: center; font-weight: bold; padding: 14px 8px;
      background: var(--tg-theme-secondary-bg-color, #f1f5f9);
      border: 1px solid transparent;
    }
    .date-label { font-size: 11px; color: #888; text-align: center; margin-top: 4px; }
    .quick-date-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .btn-quick {
      flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 8px;
      background: var(--tg-theme-secondary-bg-color, #f1f5f9);
      color: var(--tg-theme-text-color, #000);
      font-size: 14px; font-weight: bold; cursor: pointer;
      margin: 0;
    }

    .platform-box { background: var(--tg-theme-secondary-bg-color, #f1f5f9); border-radius: 10px; padding: 12px; margin-top: 10px; }
    .platform-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
    .platform-row input[type="checkbox"] { width: 22px; height: 22px; }
    .platform-row label { margin: 0; flex: 1; font-weight: normal; }
    .platform-row.disabled { opacity: 0.4; }
    .platform-row.all-row { border-bottom: 1px solid #ddd; padding-bottom: 12px; margin-bottom: 6px; }
    .platform-row.all-row label { font-weight: bold; }

    /* Searchable Select */
    .ss-container { position: relative; margin-top: 6px; }
    .ss-input {
      width: 100%; padding: 12px 14px 12px 36px;
      border: 1px solid #ccc; border-radius: 8px;
      font-size: 15px; font-family: inherit;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }
    .ss-arrow {
      position: absolute; top: 50%; left: 12px; transform: translateY(-50%);
      pointer-events: none; font-size: 14px; color: #888;
    }
    .ss-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      max-height: 240px; overflow-y: auto;
      background: #fff; border: 1px solid #ddd; border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      z-index: 1000;
    }
    .ss-item {
      padding: 12px 14px; cursor: pointer; font-size: 14px;
      border-bottom: 1px solid #f1f5f9; color: #222;
      transition: background 0.1s;
    }
    .ss-item:active { background: #dbeafe; }
    .ss-item:last-child { border-bottom: none; }
    .ss-empty {
      padding: 14px; color: #888; text-align: center; font-size: 13px;
    }
    .ss-highlight { background: #fef3c7; font-weight: bold; }
    .ss-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .ss-chip {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px;
      background: var(--tg-theme-button-color, #229ED9);
      color: #ffffff; border-radius: 20px;
      font-size: 13px; font-weight: 500;
    }
    .ss-chip-x { cursor: pointer; font-weight: bold; font-size: 16px; line-height: 1; opacity: 0.85; }
    .ss-chip-x:hover { opacity: 1; }
    .ss-debug { font-size: 11px; color: #c00; margin-top: 4px; word-break: break-all; }
  </style>
</head>
<body>

  <div id="loading" class="message msg-info">در حال بارگذاری...</div>

  <div id="formSection" class="hidden">
    <h2>فرم ثبت‌نام</h2>
    <div class="info-box" id="tgInfo"></div>
    <form id="regForm">
      <label>نام و نام خانوادگی *</label>
      <input id="fullName" type="text" required>
      <label>سمت *</label>
      <input id="position" type="text" required>
      <label>واحد *</label>
      <input id="unit" type="text" required>
      <button type="submit" id="submitBtn">ثبت‌نام</button>
    </form>
    <div id="formMessage"></div>
  </div>

  <div id="pendingSection" class="hidden">
    <h2>در انتظار تأیید ادمین ⏳</h2>
    <div class="info-box" id="pendingInfo"></div>
    <div class="message msg-warning">ثبت‌نام شما انجام شد و در انتظار تأیید ادمین است.</div>
  </div>

  <div id="activeSection" class="hidden">
    <h2>خوش آمدید ✅</h2>
    <div class="info-box" id="activeInfo"></div>
    <div class="message msg-success">دسترسی شما فعال است.</div>
    <button id="adminBtn" class="hidden" style="margin-top: 16px;">🛠 پنل ادمین</button>
  </div>

  <div id="adminSection" class="hidden">
    <h2>🛠 پنل ادمین</h2>
    <button id="backBtn" class="btn-secondary">→ بازگشت</button>

    <h3>مخاطب دستور کار</h3>
    <label>مخاطب * (تایپ کنید تا جستجو شود)</label>
    <div id="recipientSS"></div>

    <div class="platform-box">
      <div style="font-size:13px;font-weight:bold;margin-bottom:6px;">پلتفورم ارسال پیام:</div>
      <div class="platform-row all-row">
        <input type="checkbox" id="chkAll">
        <label for="chkAll">🌐 همه پلتفورم ها</label>
      </div>
      <div class="platform-row" id="rowTg">
        <input type="checkbox" id="chkTg">
        <label for="chkTg">📱 Telegram</label>
      </div>
      <div class="platform-row" id="rowBale">
        <input type="checkbox" id="chkBale">
        <label for="chkBale">📨 Bale</label>
      </div>
    </div>

    <h3>اطلاعات دستور کار</h3>
    <form id="woForm">

      <label>موضوع ردیف *</label>
      <div id="subjectWrap"></div>

      <label>شرح عملیات *</label>
      <textarea id="woDescription" required></textarea>

      <label>EPC *</label>
      <div id="epcWrap"></div>

      <label>رشته *</label>
      <div id="fieldWrap"></div>

      <label>پیمانکاری / امانی *</label>
      <div id="engagementWrap"></div>

      <label>آدرس / محل * (چند انتخابی)</label>
      <div id="addrWrap"></div>

      <label>تاریخ شروع (شمسی) *</label>
      <div class="quick-date-row">
        <button type="button" class="btn-quick" onclick="setToday()">📅 امروز</button>
        <button type="button" class="btn-quick" onclick="setTomorrow()">📅 فردا</button>
      </div>
      <div class="date-row">
        <div class="col">
          <select id="woYear"></select>
          <div class="date-label">سال</div>
        </div>
        <div class="col month">
          <select id="woMonth"></select>
          <div class="date-label">ماه</div>
        </div>
        <div class="col">
          <select id="woDay"></select>
          <div class="date-label">روز</div>
        </div>
      </div>

      <label>مدت زمان (روز) *</label>
      <input id="woDuration" type="number" min="1" required placeholder="مثال: 3">

      <button type="submit" id="woSubmitBtn">ثبت و ارسال دستور کار</button>
    </form>
    <div id="woMessage"></div>
    <div id="woDebug" class="ss-debug"></div>
  </div>

  <script>
    var API_URL = 'https://script.google.com/macros/s/AKfycbxbAjL-aXFwt8uRS3s_auq03ZdjHDaOPZwe5txc53bfIf2jobgAjJ3ST-hH3oFxDOMy/exec';
    var tg = window.Telegram && window.Telegram.WebApp;
    var tgUser = null;
    var currentAccess = '';
    var recipientsData = [];

    var recipientSS = null;
    var subjectSS = null;
    var epcSS = null;
    var fieldSS = null;
    var addressSS = null;
    var engagementSS = null;

    var MONTHS = ['', 'فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];

    if (tg) {
      tg.ready();
      tg.expand();
      tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user;
    }

    function show(id) {
      ['loading', 'formSection', 'pendingSection', 'activeSection', 'adminSection'].forEach(function(x) {
        document.getElementById(x).classList.add('hidden');
      });
      document.getElementById(id).classList.remove('hidden');
    }

    function showMessage(elId, text, type) {
      var el = document.getElementById(elId);
      el.className = 'message ' + (type === 'success' ? 'msg-success' : type === 'error' ? 'msg-error' : 'msg-info');
      el.innerText = text;
    }

    function apiCall(payload, retries) {
      if (retries === undefined) retries = 2;
      var body = JSON.stringify(payload);
      return fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: body,
        redirect: 'follow'
      })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function(text) {
        try { return JSON.parse(text); }
        catch (e) {
          console.error('Bad JSON:', text.substring(0, 500));
          throw new Error('پاسخ نامعتبر از سرور');
        }
      })
      .catch(function(err) {
        console.error('API error:', err);
        if (retries > 0) {
          return new Promise(function(resolve) { setTimeout(resolve, 800); })
            .then(function() { return apiCall(payload, retries - 1); });
        }
        throw err;
      });
    }

    // ============================================
    // Jalali Date
    // ============================================
    function gregorianToJalali(gy, gm, gd) {
      var g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
      var jy = (gy <= 1600) ? 0 : 979;
      gy -= (gy <= 1600) ? 621 : 1600;
      var gy2 = (gm > 2) ? (gy + 1) : gy;
      var days = (365 * gy) + parseInt((gy2 + 3) / 4) - parseInt((gy2 + 99) / 100) + parseInt((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
      jy += 33 * parseInt(days / 12053);
      days %= 12053;
      jy += 4 * parseInt(days / 1461);
      days %= 1461;
      if (days > 365) { jy += parseInt((days - 1) / 365); days = (days - 1) % 365; }
      var jm = (days < 186) ? 1 + parseInt(days / 31) : 7 + parseInt((days - 186) / 30);
      var jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
      return [jy, jm, jd];
    }
    function daysInJalaliMonth(y, m) { if (m <= 6) return 31; if (m <= 11) return 30; return 29; }

    var yearSel, monthSel, daySel;
    function buildDatePickers() {
      yearSel = document.getElementById('woYear');
      monthSel = document.getElementById('woMonth');
      daySel = document.getElementById('woDay');
      var now = new Date();
      var todayJ = gregorianToJalali(now.getFullYear(), now.getMonth() + 1, now.getDate());
      var year = todayJ[0];
      yearSel.innerHTML = '';
      for (var y = year - 2; y <= year + 3; y++) {
        var o = document.createElement('option'); o.value = y; o.textContent = y; yearSel.appendChild(o);
      }
      yearSel.value = year;
      monthSel.innerHTML = '';
      for (var m = 1; m <= 12; m++) {
        var o = document.createElement('option'); o.value = m; o.textContent = MONTHS[m]; monthSel.appendChild(o);
      }
      monthSel.value = todayJ[1];
      function refreshDays() {
        var y = parseInt(yearSel.value);
        var m = parseInt(monthSel.value);
        var max = daysInJalaliMonth(y, m);
        var cur = parseInt(daySel.value) || 1;
        daySel.innerHTML = '';
        for (var d = 1; d <= max; d++) {
          var o = document.createElement('option'); o.value = d; o.textContent = d; daySel.appendChild(o);
        }
        daySel.value = Math.min(cur, max);
      }
      yearSel.addEventListener('change', refreshDays);
      monthSel.addEventListener('change', refreshDays);
      refreshDays();
      daySel.value = todayJ[2];
    }
    function setDateDropdowns(y, m, d) {
      yearSel.value = y; monthSel.value = m;
      var ev = document.createEvent('HTMLEvents'); ev.initEvent('change', true, false);
      monthSel.dispatchEvent(ev);
      daySel.value = d;
    }
    function setToday() {
      var now = new Date();
      var j = gregorianToJalali(now.getFullYear(), now.getMonth() + 1, now.getDate());
      setDateDropdowns(j[0], j[1], j[2]);
    }
    function setTomorrow() {
      var t = new Date(); t.setDate(t.getDate() + 1);
      var j = gregorianToJalali(t.getFullYear(), t.getMonth() + 1, t.getDate());
      setDateDropdowns(j[0], j[1], j[2]);
    }

    // ============================================
    // Searchable Select - با پشتیبانی از موبایل
    // ============================================
    function createSearchSelect(containerId, opts) {
      var container = document.getElementById(containerId);
      container.innerHTML = '';
      container.className = 'ss-container';

      var multi = opts.multi === true;
      var options = (opts.options || []).slice();
      var placeholder = opts.placeholder || 'تایپ کنید...';
      var selectedValue = multi ? [] : '';

      var input = document.createElement('input');
      input.type = 'text';
      input.className = 'ss-input';
      input.placeholder = placeholder;
      input.autocomplete = 'off';
      container.appendChild(input);

      var arrow = document.createElement('span');
      arrow.className = 'ss-arrow';
      arrow.textContent = '▼';
      container.appendChild(arrow);

      var dropdown = document.createElement('div');
      dropdown.className = 'ss-dropdown hidden';
      container.appendChild(dropdown);

      var chipsWrap = document.createElement('div');
      chipsWrap.className = 'ss-chips';
      container.appendChild(chipsWrap);

      function normOpt(o) {
        if (typeof o === 'string') return { value: o, label: o };
        return { value: o.value, label: o.label || o.value };
      }
      function labelFor(v) {
        for (var i = 0; i < options.length; i++) {
          var o = normOpt(options[i]);
          if (o.value === v) return o.label;
        }
        return v;
      }
      function highlight(text, q) {
        if (!q) return document.createTextNode(text);
        var idx = text.toLowerCase().indexOf(q.toLowerCase());
        if (idx === -1) return document.createTextNode(text);
        var frag = document.createDocumentFragment();
        frag.appendChild(document.createTextNode(text.substring(0, idx)));
        var span = document.createElement('span');
        span.className = 'ss-highlight';
        span.textContent = text.substring(idx, idx + q.length);
        frag.appendChild(span);
        frag.appendChild(document.createTextNode(text.substring(idx + q.length)));
        return frag;
      }

      function renderDropdown(filter) {
        var q = String(filter || '').trim().toLowerCase();
        dropdown.innerHTML = '';
        var items = [];
        for (var i = 0; i < options.length; i++) {
          var o = normOpt(options[i]);
          if (multi && selectedValue.indexOf(o.value) !== -1) continue;
          if (!multi && selectedValue === o.value && q === '') continue;
          if (q) {
            var lbl = o.label.toLowerCase();
            var vll = o.value.toLowerCase();
            if (lbl.indexOf(q) === -1 && vll.indexOf(q) === -1) continue;
          }
          items.push(o);
        }
        if (items.length === 0) {
          var empty = document.createElement('div');
          empty.className = 'ss-empty';
          empty.textContent = options.length === 0 ? 'هیچ گزینه‌ای موجود نیست' : 'نتیجه‌ای یافت نشد';
          dropdown.appendChild(empty);
          return;
        }
        items.forEach(function(o) {
          var item = document.createElement('div');
          item.className = 'ss-item';
          if (q) item.appendChild(highlight(o.label, q));
          else item.textContent = o.label;
          item.setAttribute('data-value', o.value);

          // برای موبایل و دسکتاپ
          function pick(ev) {
            if (ev) { ev.preventDefault(); ev.stopPropagation(); }
            if (multi) {
              if (selectedValue.indexOf(o.value) === -1) selectedValue.push(o.value);
              input.value = '';
              renderChips();
              renderDropdown('');
              if (opts.onChange) opts.onChange(selectedValue.slice());
            } else {
              selectedValue = o.value;
              input.value = o.label;
              dropdown.classList.add('hidden');
              renderChips();
              if (opts.onChange) opts.onChange(selectedValue);
            }
          }
          item.addEventListener('mousedown', pick);
          item.addEventListener('touchstart', pick, { passive: false });
          dropdown.appendChild(item);
        });
      }

      function renderChips() {
        chipsWrap.innerHTML = '';
        if (multi) {
          selectedValue.forEach(function(v) {
            var chip = document.createElement('span');
            chip.className = 'ss-chip';
            var t = document.createElement('span');
            t.textContent = labelFor(v);
            var x = document.createElement('span');
            x.className = 'ss-chip-x';
            x.textContent = '×';
            x.addEventListener('click', function(ev) {
              ev.stopPropagation();
              selectedValue = selectedValue.filter(function(s) { return s !== v; });
              renderChips();
              renderDropdown(input.value);
              if (opts.onChange) opts.onChange(selectedValue.slice());
            });
            chip.appendChild(t);
            chip.appendChild(x);
            chipsWrap.appendChild(chip);
          });
        } else {
          if (selectedValue) {
            var chip = document.createElement('span');
            chip.className = 'ss-chip';
            var t = document.createElement('span');
            t.textContent = labelFor(selectedValue);
            var x = document.createElement('span');
            x.className = 'ss-chip-x';
            x.textContent = '×';
            x.addEventListener('click', function(ev) {
              ev.stopPropagation();
              selectedValue = '';
              input.value = '';
              renderChips();
              renderDropdown('');
              if (opts.onChange) opts.onChange('');
            });
            chip.appendChild(t);
            chip.appendChild(x);
            chipsWrap.appendChild(chip);
          }
        }
      }

      input.addEventListener('focus', function() {
        dropdown.classList.remove('hidden');
        renderDropdown(input.value);
      });
      input.addEventListener('input', function() {
        if (!multi) {
          if (input.value !== labelFor(selectedValue)) {
            selectedValue = '';
            renderChips();
            if (opts.onChange) opts.onChange('');
          }
        }
        dropdown.classList.remove('hidden');
        renderDropdown(input.value);
      });
      // بستن dropdown وقتی کاربر جای دیگه کلیک می‌کنه (بدون blur مشکل‌دار)
      document.addEventListener('click', function(ev) {
        if (!container.contains(ev.target)) {
          dropdown.classList.add('hidden');
        }
      });

      renderChips();
      renderDropdown('');

      return {
        getValue: function() { return multi ? selectedValue.slice() : selectedValue; },
        getRawString: function() {
          if (multi) return selectedValue.join('، ');
          return selectedValue;
        },
        setOptions: function(newOpts) {
          options = (newOpts || []).slice();
          renderDropdown(input.value);
        },
        setPlaceholder: function(p) {
          placeholder = p;
          input.placeholder = p;
        },
        clear: function() {
          selectedValue = multi ? [] : '';
          input.value = '';
          renderChips();
          renderDropdown('');
        }
      };
    }

    // ============================================
    // Init
    // ============================================
    if (!tgUser) {
      show('loading');
      document.getElementById('loading').innerText = 'لطفاً از داخل تلگرام باز کنید.';
    } else {
      buildDatePickers();
      checkStatus();
    }

    function checkStatus() {
      apiCall({ action: 'getUserStatus', chatId: tgUser.id })
        .then(function(res) {
          if (res && res.registered) {
            var u = res.userData;
            currentAccess = String(u.access || '').trim();
            if (u.active === true || u.active === 'TRUE' || u.active === 'true') {
              var box = document.getElementById('activeInfo');
              box.innerHTML =
                '<b>نام:</b> ' + (u.fullName || '—') + '<br>' +
                '<b>سمت:</b> ' + (u.position || '—') + '<br>' +
                '<b>واحد:</b> ' + (u.unit || '—') + '<br>' +
                '<b>وضعیت:</b> <span class="badge badge-active">فعال</span><br>' +
                '<b>سطح دسترسی:</b> <span class="badge badge-access">' + (currentAccess || 'تعیین نشده') + '</span>';
              if (currentAccess === 'ادمین') document.getElementById('adminBtn').classList.remove('hidden');
              show('activeSection');
            } else {
              var pbox = document.getElementById('pendingInfo');
              pbox.innerHTML =
                '<b>نام:</b> ' + (u.fullName || '—') + '<br>' +
                '<b>سمت:</b> ' + (u.position || '—') + '<br>' +
                '<b>وضعیت:</b> <span class="badge badge-inactive">در انتظار تأیید</span>';
              show('pendingSection');
            }
          } else {
            var info = document.getElementById('tgInfo');
            info.innerHTML =
              '<b>شناسه:</b> ' + tgUser.id + '<br>' +
              '<b>نام تلگرام:</b> ' + tgUser.first_name + ' ' + (tgUser.last_name || '') + '<br>' +
              '<b>یوزرنیم:</b> ' + (tgUser.username ? '@' + tgUser.username : 'ندارد');
            show('formSection');
          }
        })
        .catch(function(err) {
          show('formSection');
          showMessage('formMessage', 'خطا: ' + err.message, 'error');
        });
    }

    document.getElementById('regForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.innerText = 'در حال ارسال...';
      apiCall({
        action: 'registerUser',
        chatId: tgUser.id,
        username: tgUser.username || '',
        fullName: document.getElementById('fullName').value.trim(),
        position: document.getElementById('position').value.trim(),
        unit: document.getElementById('unit').value.trim()
      })
      .then(function(res) {
        btn.disabled = false; btn.innerText = 'ثبت‌نام';
        if (res.ok) {
          showMessage('formMessage', '✅ ' + res.message, 'success');
          document.getElementById('regForm').reset();
          setTimeout(checkStatus, 1500);
        } else {
          showMessage('formMessage', '❌ ' + res.message, 'error');
        }
      })
      .catch(function(err) {
        btn.disabled = false; btn.innerText = 'ثبت‌نام';
        showMessage('formMessage', '❌ خطا: ' + err.message, 'error');
      });
    });

    document.getElementById('adminBtn').addEventListener('click', function() {
      show('adminSection');
      loadRecipients();
      loadFormOptions();
    });

    document.getElementById('backBtn').addEventListener('click', function() {
      show('activeSection');
    });

    // ============================================
    // Recipients
    // ============================================
    function loadRecipients() {
      recipientSS = createSearchSelect('recipientSS', {
        multi: false,
        options: [],
        placeholder: 'در حال بارگذاری...',
        onChange: onRecipientChange
      });
      apiCall({ action: 'getRecipients' })
        .then(function(res) {
          recipientsData = res.recipients || [];
          if (recipientsData.length === 0) {
            recipientSS.setPlaceholder('هیچ مخاطبی یافت نشد');
            return;
          }
          var opts = recipientsData.map(function(c) {
            return { value: c.systemName, label: c.displayName };
          });
          recipientSS.setOptions(opts);
          recipientSS.setPlaceholder('تایپ کنید (' + opts.length + ' مخاطب)');
        })
        .catch(function(err) {
          recipientSS.setPlaceholder('خطا: ' + err.message);
        });
    }

    function onRecipientChange(val) {
      var chkTg = document.getElementById('chkTg');
      var chkBale = document.getElementById('chkBale');
      var chkAll = document.getElementById('chkAll');
      var rowTg = document.getElementById('rowTg');
      var rowBale = document.getElementById('rowBale');
      chkTg.checked = false; chkBale.checked = false; chkAll.checked = false;
      rowTg.classList.remove('disabled'); rowBale.classList.remove('disabled');
      chkTg.disabled = false; chkBale.disabled = false;
      if (!val) return;
      var r = null;
      for (var i = 0; i < recipientsData.length; i++) {
        if (recipientsData[i].systemName === val) { r = recipientsData[i]; break; }
      }
      if (!r) return;
      if (r.telegramChatId) { chkTg.checked = true; } else { chkTg.disabled = true; rowTg.classList.add('disabled'); }
      if (r.baleChatId) { chkBale.checked = true; } else { chkBale.disabled = true; rowBale.classList.add('disabled'); }
      updateAllCheckbox();
    }

    function updateAllCheckbox() {
      var chkTg = document.getElementById('chkTg');
      var chkBale = document.getElementById('chkBale');
      var chkAll = document.getElementById('chkAll');
      var enabled = [];
      if (!chkTg.disabled) enabled.push(chkTg);
      if (!chkBale.disabled) enabled.push(chkBale);
      if (enabled.length === 0) { chkAll.checked = false; return; }
      var allChecked = enabled.every(function(c) { return c.checked; });
      chkAll.checked = allChecked;
    }

    document.getElementById('chkAll').addEventListener('change', function() {
      var checked = this.checked;
      var chkTg = document.getElementById('chkTg');
      var chkBale = document.getElementById('chkBale');
      if (!chkTg.disabled) chkTg.checked = checked;
      if (!chkBale.disabled) chkBale.checked = checked;
    });
    document.getElementById('chkTg').addEventListener('change', updateAllCheckbox);
    document.getElementById('chkBale').addEventListener('change', updateAllCheckbox);

    // ============================================
    // Form Options
    // ============================================
    function loadFormOptions() {
      subjectSS = createSearchSelect('subjectWrap', { multi: false, options: [], placeholder: 'در حال بارگذاری...' });
      epcSS = createSearchSelect('epcWrap', { multi: false, options: [], placeholder: 'در حال بارگذاری...' });
      fieldSS = createSearchSelect('fieldWrap', { multi: false, options: [], placeholder: 'در حال بارگذاری...' });
      engagementSS = createSearchSelect('engagementWrap', { multi: false, options: [], placeholder: 'در حال بارگذاری...' });
      addressSS = createSearchSelect('addrWrap', { multi: true, options: [], placeholder: 'در حال بارگذاری...' });

      apiCall({ action: 'getFormOptions' })
        .then(function(res) {
          var subjOpts = (res.subjects && res.subjects.options) || [];
          var epcOpts = (res.epcs && res.epcs.options) || [];
          var fieldOpts = (res.fields && res.fields.options) || [];
          var engOpts = (res.engagementTypes && res.engagementTypes.options) || [];
          var addrOpts = (res.addresses && res.addresses.options) || [];

          subjectSS.setOptions(subjOpts);
          subjectSS.setPlaceholder(subjOpts.length ? 'انتخاب یا جستجو (' + subjOpts.length + ')...' : 'تایپ کنید');

          epcSS.setOptions(epcOpts);
          epcSS.setPlaceholder(epcOpts.length ? 'انتخاب یا جستجو (' + epcOpts.length + ')...' : 'تایپ کنید');

          fieldSS.setOptions(fieldOpts);
          fieldSS.setPlaceholder(fieldOpts.length ? 'انتخاب یا جستجو (' + fieldOpts.length + ')...' : 'تایپ کنید');

          engagementSS.setOptions(engOpts);
          engagementSS.setPlaceholder(engOpts.length ? 'انتخاب یا جستجو (' + engOpts.length + ')...' : 'تایپ کنید');

          addressSS.setOptions(addrOpts);
          addressSS.setPlaceholder(addrOpts.length ? 'انتخاب چندتایی (' + addrOpts.length + ')...' : 'تایپ کنید');

          console.log('FormOptions loaded:', {
            subj: subjOpts.length,
            epc: epcOpts.length,
            field: fieldOpts.length,
            eng: engOpts.length,
            addr: addrOpts.length
          });
        })
        .catch(function(err) {
          console.error('FormOptions error:', err);
        });
    }

    // ============================================
    // Submit
    // ============================================
    document.getElementById('woForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('woSubmitBtn');
      btn.disabled = true; btn.innerText = 'در حال ارسال...';

      var payload = {
        action: 'createWorkOrder',
        adminChatId: String(tgUser.id),
        recipientSystemName: recipientSS ? recipientSS.getRawString() : '',
        sendTelegram: document.getElementById('chkTg').checked,
        sendBale: document.getElementById('chkBale').checked,
        subject: subjectSS ? subjectSS.getRawString() : '',
        description: document.getElementById('woDescription').value.trim(),
        epc: epcSS ? epcSS.getRawString() : '',
        field: fieldSS ? fieldSS.getRawString() : '',
        engagementType: engagementSS ? engagementSS.getRawString() : '',
        address: addressSS ? addressSS.getRawString() : '',
        startYear: document.getElementById('woYear').value,
        startMonth: document.getElementById('woMonth').value,
        startDay: document.getElementById('woDay').value,
        duration: document.getElementById('woDuration').value
      };

      console.log('Submitting:', payload);
      var dbg = document.getElementById('woDebug');
      dbg.innerText = '';

      apiCall(payload)
        .then(function(res) {
          btn.disabled = false; btn.innerText = 'ثبت و ارسال دستور کار';
          if (res.ok) {
            var msg = '✅ ' + res.message;
            if (res.recipient) msg += '\nمخاطب: ' + res.recipient;
            if (res.status) msg += '\nوضعیت: ' + res.status;
            if (res.sends) msg += '\nارسال: ' + res.sends;
            if (res.logs) msg += '\n\n📋 ' + res.logs;
            showMessage('woMessage', msg, 'success');
            document.getElementById('woForm').reset();
            if (recipientSS) recipientSS.clear();
            if (subjectSS) subjectSS.clear();
            if (epcSS) epcSS.clear();
            if (fieldSS) fieldSS.clear();
            if (addressSS) addressSS.clear();
            if (engagementSS) engagementSS.clear();
            document.getElementById('chkTg').checked = false;
            document.getElementById('chkBale').checked = false;
            document.getElementById('chkAll').checked = false;
          } else {
            var emsg = '❌ ' + res.message;
            if (res.logs) emsg += '\n\n📋 ' + res.logs;
            showMessage('woMessage', emsg, 'error');
          }
        })
        .catch(function(err) {
          btn.disabled = false; btn.innerText = 'ثبت و ارسال دستور کار';
          showMessage('woMessage', '❌ خطا: ' + err.message, 'error');
        });
    });
  </script>
</body>
</html>
