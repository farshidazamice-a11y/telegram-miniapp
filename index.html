<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>پروژه ایگل</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Tahoma, sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      direction: rtl;
    }
    h2 { text-align: center; color: var(--tg-theme-button-color, #229ED9); margin-bottom: 20px; }
    h3 { color: var(--tg-theme-button-color, #229ED9); margin: 20px 0 10px; font-size: 15px; }
    .info-box {
      background: var(--tg-theme-secondary-bg-color, #f1f5f9);
      border-radius: 10px; padding: 12px; margin-bottom: 16px;
      font-size: 13px; line-height: 1.8;
    }
    label { display: block; margin-top: 14px; margin-bottom: 6px; font-size: 14px; font-weight: bold; }
    input, select, textarea {
      width: 100%; padding: 12px;
      border: 1px solid #ccc; border-radius: 8px;
      font-size: 15px; font-family: inherit;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    textarea { min-height: 80px; resize: vertical; }
    button {
      width: 100%; margin-top: 22px; padding: 14px;
      border: none; border-radius: 10px;
      background: var(--tg-theme-button-color, #229ED9);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-size: 16px; font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    .btn-secondary {
      background: var(--tg-theme-secondary-bg-color, #e2e8f0);
      color: var(--tg-theme-text-color, #000000);
    }
    .message {
      margin-top: 16px; padding: 12px; border-radius: 10px;
      text-align: center; font-size: 14px; white-space: pre-line;
    }
    .msg-success { background: #d1fae5; color: #065f46; }
    .msg-error { background: #fee2e2; color: #991b1b; }
    .msg-info { background: #dbeafe; color: #1e40af; }
    .msg-warning { background: #fef3c7; color: #92400e; }
    .hidden { display: none; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
    .badge-active { background: #d1fae5; color: #065f46; }
    .badge-inactive { background: #fee2e2; color: #991b1b; }
    .badge-access { background: #dbeafe; color: #1e40af; }
    .badge-admin { background: #fde68a; color: #92400e; }
  </style>
</head>
<body>

  <div id="loading" class="message msg-info">در حال بارگذاری...</div>

  <div id="formSection" class="hidden">
    <h2>فرم ثبت‌نام</h2>
    <div class="info-box" id="tgInfo"></div>
    <form id="regForm">
      <label>نام و نام خانوادگی *</label>
      <input id="fullName" type="text" required>
      <label>سمت *</label>
      <input id="position" type="text" required>
      <label>واحد *</label>
      <input id="unit" type="text" required>
      <button type="submit" id="submitBtn">ثبت‌نام</button>
    </form>
    <div id="formMessage"></div>
  </div>

  <div id="pendingSection" class="hidden">
    <h2>در انتظار تأیید ادمین ⏳</h2>
    <div class="info-box" id="pendingInfo"></div>
    <div class="message msg-warning">
      ثبت‌نام شما انجام شد و در انتظار تأیید توسط ادمین است.
    </div>
  </div>

  <div id="activeSection" class="hidden">
    <h2>خوش آمدید ✅</h2>
    <div class="info-box" id="activeInfo"></div>
    <div class="message msg-success">دسترسی شما فعال است.</div>
    <button id="adminBtn" class="hidden" style="margin-top: 16px;">🛠 پنل ادمین</button>
  </div>

  <div id="adminSection" class="hidden">
    <h2>🛠 پنل ادمین</h2>
    <button id="backBtn" class="btn-secondary">→ بازگشت</button>

    <h3>ثبت دستور کار جدید</h3>
    <form id="woForm">
      <label>پیمانکار *</label>
      <select id="woContractor" required></select>

      <label>موضوع *</label>
      <input id="woSubject" type="text" required>

      <label>شرح عملیات *</label>
      <textarea id="woDescription" required></textarea>

      <label>EPC *</label>
      <select id="woEpc" required>
        <option value="ساخت">ساخت</option>
        <option value="خرید">خرید</option>
        <option value="مالی">مالی</option>
        <option value="پرسنلی">پرسنلی</option>
        <option value="مهندسی">مهندسی</option>
      </select>

      <label>رشته *</label>
      <input id="woField" type="text" required placeholder="مثال: ابنیه، برق، تاسیسات">

      <label>آدرس / محل *</label>
      <input id="woAddress" type="text" required placeholder="مثال: طبقه اول">

      <label>تاریخ شروع (شمسی) *</label>
      <input id="woStartDate" type="text" required placeholder="1405-5-22">

      <label>مدت زمان (روز) *</label>
      <input id="woDuration" type="number" min="1" required placeholder="2">

      <button type="submit" id="woSubmitBtn">ثبت دستور کار</button>
    </form>
    <div id="woMessage"></div>
  </div>

  <script>
    var API_URL = 'https://script.google.com/macros/s/AKfycbxbAjL-aXFwt8uRS3s_auq03ZdjHDaOPZwe5txc53bfIf2jobgAjJ3ST-hH3oFxDOMy/exec';

    var tg = window.Telegram && window.Telegram.WebApp;
    var tgUser = null;
    var currentAccess = '';

    if (tg) {
      tg.ready();
      tg.expand();
      tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user;
    }

    function show(id) {
      ['loading', 'formSection', 'pendingSection', 'activeSection', 'adminSection'].forEach(function(x) {
        document.getElementById(x).classList.add('hidden');
      });
      document.getElementById(id).classList.remove('hidden');
    }

    function showMessage(elId, text, type) {
      var el = document.getElementById(elId);
      el.className = 'message ' + (type === 'success' ? 'msg-success' : type === 'error' ? 'msg-error' : 'msg-info');
      el.innerText = text;
    }

    function apiCall(payload) {
      return fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(function(r) { return r.json(); });
    }

    if (!tgUser) {
      show('loading');
      document.getElementById('loading').innerText = 'لطفاً از داخل تلگرام باز کنید.';
    } else {
      checkStatus();
    }

    function checkStatus() {
      apiCall({ action: 'getUserStatus', chatId: tgUser.id })
        .then(function(res) {
          if (res && res.registered) {
            var u = res.userData;
            currentAccess = String(u.access || '').trim();

            if (u.active === true || u.active === 'TRUE' || u.active === 'true') {
              var box = document.getElementById('activeInfo');
              box.innerHTML =
                '<b>نام:</b> ' + (u.fullName || '—') + '<br>' +
                '<b>سمت:</b> ' + (u.position || '—') + '<br>' +
                '<b>واحد:</b> ' + (u.unit || '—') + '<br>' +
                '<b>وضعیت:</b> <span class="badge badge-active">فعال</span><br>' +
                '<b>سطح دسترسی:</b> <span class="badge badge-access">' + (currentAccess || 'تعیین نشده') + '</span>';

              if (currentAccess === 'ادمین') {
                document.getElementById('adminBtn').classList.remove('hidden');
              }

              show('activeSection');
            } else {
              var pbox = document.getElementById('pendingInfo');
              pbox.innerHTML =
                '<b>نام:</b> ' + (u.fullName || '—') + '<br>' +
                '<b>سمت:</b> ' + (u.position || '—') + '<br>' +
                '<b>واحد:</b> ' + (u.unit || '—') + '<br>' +
                '<b>وضعیت:</b> <span class="badge badge-inactive">در انتظار تأیید</span>';
              show('pendingSection');
            }
          } else {
            var info = document.getElementById('tgInfo');
            info.innerHTML =
              '<b>شناسه:</b> ' + tgUser.id + '<br>' +
              '<b>نام تلگرام:</b> ' + tgUser.first_name + ' ' + (tgUser.last_name || '') + '<br>' +
              '<b>یوزرنیم:</b> ' + (tgUser.username ? '@' + tgUser.username : 'ندارد');
            show('formSection');
          }
        })
        .catch(function(err) {
          show('formSection');
          showMessage('formMessage', 'خطا: ' + err.message, 'error');
        });
    }

    // ثبت‌نام
    document.getElementById('regForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var fullName = document.getElementById('fullName').value.trim();
      var position = document.getElementById('position').value.trim();
      var unit = document.getElementById('unit').value.trim();
      if (!fullName || !position || !unit) {
        showMessage('formMessage', 'همه فیلدها الزامی هستند', 'error');
        return;
      }
      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = 'در حال ارسال...';
      apiCall({
        action: 'registerUser',
        chatId: tgUser.id,
        username: tgUser.username || '',
        fullName: fullName,
        position: position,
        unit: unit
      })
      .then(function(res) {
        btn.disabled = false;
        btn.innerText = 'ثبت‌نام';
        if (res.ok) {
          showMessage('formMessage', '✅ ' + res.message, 'success');
          document.getElementById('regForm').reset();
          setTimeout(checkStatus, 1500);
        } else {
          showMessage('formMessage', '❌ ' + res.message, 'error');
        }
      })
      .catch(function(err) {
        btn.disabled = false;
        btn.innerText = 'ثبت‌نام';
        showMessage('formMessage', '❌ خطا: ' + err.message, 'error');
      });
    });

    // پنل ادمین
    document.getElementById('adminBtn').addEventListener('click', function() {
      show('adminSection');
      // لود لیست پیمانکاران
      var sel = document.getElementById('woContractor');
      sel.innerHTML = '<option value="">در حال بارگذاری...</option>';
      apiCall({ action: 'getContractors' })
        .then(function(res) {
          if (res.ok && res.contractors && res.contractors.length > 0) {
            sel.innerHTML = '<option value="">— انتخاب کنید —</option>';
            res.contractors.forEach(function(c) {
              var opt = document.createElement('option');
              opt.value = c.name;
              opt.textContent = c.name + ' (' + c.platform + ')';
              sel.appendChild(opt);
            });
          } else {
            sel.innerHTML = '<option value="">هیچ پیمانکاری یافت نشد</option>';
          }
        })
        .catch(function(err) {
          sel.innerHTML = '<option value="">خطا: ' + err.message + '</option>';
        });
    });

    document.getElementById('backBtn').addEventListener('click', function() {
      show('activeSection');
    });

    document.getElementById('woForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('woSubmitBtn');
      btn.disabled = true;
      btn.innerText = 'در حال ارسال...';

      apiCall({
        action: 'createWorkOrder',
        adminChatId: String(tgUser.id),
        contractorName: document.getElementById('woContractor').value,
        subject: document.getElementById('woSubject').value.trim(),
        description: document.getElementById('woDescription').value.trim(),
        epc: document.getElementById('woEpc').value,
        field: document.getElementById('woField').value.trim(),
        address: document.getElementById('woAddress').value.trim(),
        startDate: document.getElementById('woStartDate').value.trim(),
        duration: document.getElementById('woDuration').value
      })
      .then(function(res) {
        btn.disabled = false;
        btn.innerText = 'ثبت دستور کار';
        if (res.ok) {
          showMessage('woMessage', '✅ ' + res.message + '\nبرای: ' + res.contractorName, 'success');
          document.getElementById('woForm').reset();
        } else {
          showMessage('woMessage', '❌ ' + res.message, 'error');
        }
      })
      .catch(function(err) {
        btn.disabled = false;
        btn.innerText = 'ثبت دستور کار';
        showMessage('woMessage', '❌ خطا: ' + err.message, 'error');
      });
    });
  </script>
</body>
</html>
