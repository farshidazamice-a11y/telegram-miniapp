// ============ Ticker ============
var tickerIndex = 0;
var tickerItems = [];
var tickerIntervalId = null;

function startTicker() {
  tickerItems = [];
  if (weatherData) {
    tickerItems.push({ icon: weatherData.icon, text: '🌤️ ' + WEATHER_CITY + ' — ' + weatherData.temp + '°C ' + weatherData.text });
  } else {
    tickerItems.push({ icon: '🌤️', text: '🌤️ در حال دریافت آب و هوا...' });
  }
  var now = new Date();
  var j = g2j(now.getFullYear(), now.getMonth() + 1, now.getDate());
  var ev = IRAN_EVENTS[j[1] + '-' + j[2]];
  if (ev) tickerItems.push({ icon: '🎉', text: ev });
  else tickerItems.push({ icon: '📅', text: '📅 امروز: ' + WEEKDAYS[now.getDay()] + ' ' + j[2] + ' ' + MONTHS[j[1]] + ' ' + j[0] });

  tickerIndex = 0;
  updateTickerDisplay();
  if (tickerIntervalId) clearInterval(tickerIntervalId);
  tickerIntervalId = setInterval(function() {
    tickerIndex = (tickerIndex + 1) % tickerItems.length;
    updateTickerDisplay();
  }, 4000);
}

function updateTickerDisplay() {
  var iconEl = document.getElementById('tickerIcon');
  var textEl = document.getElementById('tickerText');
  if (!iconEl || !textEl) return;
  var item = tickerItems[tickerIndex];
  if (!item) return;
  iconEl.textContent = item.icon;
  textEl.classList.remove('active');
  setTimeout(function() {
    textEl.textContent = item.text;
    textEl.classList.add('active');
  }, 200);
}

function navigateTo(screenId) {
  if (navIndex < navStack.length - 1) navStack = navStack.slice(0, navIndex + 1);
  if (navStack.length > 0 && navStack[navStack.length - 1] === screenId) return;
  navStack.push(screenId);
  navIndex = navStack.length - 1;
  renderScreen(screenId);
  updateNavBtns();
}
function renderScreen(screenId) {
  ['loading','welcomeSection','formSection','panelMenuSection','reportsSection','workOrderSection','previewSection'].forEach(function(x) {
    var el = document.getElementById(x);
    if (el) el.classList.remove('active');
  });

  if (t) t.classList.add('active');

  var topbar = document.getElementById('topbar');
  var ticker = document.getElementById('ticker');
  if (screenId === 'loading') {
    topbar.classList.add('hidden');
    ticker.classList.add('hidden');

function escHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function api(data, retries) {
  if (data.action === 'createWorkOrder') retries = 0;
  else if (retries === undefined) retries = 1;
  return fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(data),
    redirect: 'follow', cache: 'no-store'
  })
  .then(function(r) { return r.text(); })
  .then(function(t) { try { return JSON.parse(t); } catch (e) { throw new Error('bad response'); } })
  .catch(function(err) {
    if (retries > 0) return new Promise(function(r) { setTimeout(r, 700); }).then(function() { return api(data, retries - 1); });
    throw err;
  });
}

// ============ Jalali ============
function g2j(gy, gm, gd) {
  var m = [0,31,59,90,120,151,181,212,243,273,304,334];
  var jy = gy <= 1600 ? 0 : 979;
  gy -= gy <= 1600 ? 621 : 1600;
  var gy2 = gm > 2 ? gy + 1 : gy;
  var d = (365*gy) + parseInt((gy2+3)/4) - parseInt((gy2+99)/100) + parseInt((gy2+399)/400) - 80 + gd + m[gm-1];
  jy += 33*parseInt(d/12053); d %= 12053;
  jy += 4*parseInt(d/1461); d %= 1461;
  if (d > 365) { jy += parseInt((d-1)/365); d = (d-1)%365; }
  var jm = d < 186 ? 1+parseInt(d/31) : 7+parseInt((d-186)/30);
  var jd = 1 + (d < 186 ? d%31 : (d-186)%30);
  return [jy, jm, jd];
}
function j2g(jy, jm, jd) {
  jy += 1595;
  var d = -355668 + 365*jy + parseInt(jy/33)*8 + parseInt(((jy%33)+3)/4) + jd + (jm<7 ? (jm-1)*31 : (jm-7)*30+186);
  var gy = 400*parseInt(d/146097); d %= 146097;
  if (d > 36524) { gy += 100*parseInt(--d/36524); d %= 36524; if (d >= 365) d++; }
  gy += 4*parseInt(d/1461); d %= 1461;
  if (d > 365) { gy += parseInt((d-1)/365); d = (d-1)%365; }
  var gd = d+1;
  var sa = [0,31,((gy%4===0&&gy%100!==0)||(gy%400===0))?29:28,31,30,31,30,31,31,30,31,30,31];
  var gm;
  for (gm = 0; gm < 13; gm++) { var v = sa[gm]; if (gd <= v) break; gd -= v; }
  return [gy, gm, gd];
}
function dim(y, m) { return m <= 6 ? 31 : (m <= 11 ? 30 : 29); }

function pad2(n) { return String(n).length < 2 ? '0' + n : String(n); }

function setDateFilter(type) {
  currentDateFilter = type;
  var btns = document.querySelectorAll('#reportsSection [data-date]');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('active', btns[i].getAttribute('data-date') === type);
  }
  if (type !== 'custom') {
    var f = document.getElementById('dateFromInput');
    var t = document.getElementById('dateToInput');
    if (f) f.value = '';
    if (t) t.value = '';
  }
}

function getDateRangeForFilter(type) {
  if (type === 'all') return { from: '', to: '' };

  var now = new Date();
  var todayJ = g2j(now.getFullYear(), now.getMonth() + 1, now.getDate());
  var todayStr = todayJ[0] + '-' + pad2(todayJ[1]) + '-' + pad2(todayJ[2]);

  if (type === 'today') return { from: todayStr, to: todayStr };

  if (type === 'tomorrow') {
    var tm = new Date(now.getTime() + 86400000);
    var tj = g2j(tm.getFullYear(), tm.getMonth() + 1, tm.getDate());
    var tmStr = tj[0] + '-' + pad2(tj[1]) + '-' + pad2(tj[2]);
    return { from: tmStr, to: tmStr };
  }

  if (type === 'week') {
    var dow = now.getDay();
    var daysToSat = (dow - 6 + 7) % 7;
    var sat = new Date(now.getTime() - daysToSat * 86400000);
    var fri = new Date(sat.getTime() + 6 * 86400000);
    var sj = g2j(sat.getFullYear(), sat.getMonth() + 1, sat.getDate());
    var fj = g2j(fri.getFullYear(), fri.getMonth() + 1, fri.getDate());
    return {
      from: sj[0] + '-' + pad2(sj[1]) + '-' + pad2(sj[2]),
      to:   fj[0] + '-' + pad2(fj[1]) + '-' + pad2(fj[2])
    };
  }

  return { from: '', to: '' };
}

function applyDateFilter() {
  var range = null;
  if (currentDateFilter === 'custom') {
    var f = document.getElementById('dateFromInput').value.trim();
    var t = document.getElementById('dateToInput').value.trim();
    if (!f || !t) {
      alert('لطفاً بازه تاریخ را کامل وارد کنید (مثال: 1405-6-1)');
      return;
    }
    range = { from: f, to: t };
  } else {
    range = getDateRangeForFilter(currentDateFilter);
  }
  if (!range) { alert('فیلتر تاریخ نامعتبر'); return; }
  loadReports(range);
}

document.getElementById('applyDateFilterBtn').onclick = applyDateFilter;

function setFilter(f) {

function getNodeType(code) {
  if (!code) return 'order';
  var first = code.charAt(0).toUpperCase();
  if (first === 'R') return 'report';
  if (first === 'C') return 'comment';
  return 'order';
}
function getTypeIcon(type) {
  if (type === 'report') return '📊';
  if (type === 'comment') return '💬';
  return '📋';
}

function renderTree() {
  var container = document.getElementById('treeContainer');
  if (!container) return;
  container.innerHTML = '';

  var filtered = reportsData.filter(function(o) {
    if (currentFilter !== 'all') {
      var t = getNodeType(o.code);
      if (t !== currentFilter) return false;
    }
    if (currentContractors.length > 0) {
      if (currentContractors.indexOf(String(o.recipient || '').trim()) === -1) return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    container.innerHTML = '<div class="tree-empty">📭 هیچ موردی یافت نشد</div>';
    return;
  }

  var childrenMap = {};
  filtered.forEach(function(o) {
    var parent = o.parentCode || '';
    if (!childrenMap[parent]) childrenMap[parent] = [];
    childrenMap[parent].push(o);
  });

  var codesInList = {};
  filtered.forEach(function(o) { codesInList[o.code] = true; });

  var roots = filtered.filter(function(o) {
    var t = getNodeType(o.code);
    if (t !== 'order') return false;
    if (!o.parentCode) return true;
    if (!codesInList[o.parentCode]) return true;
    return false;
  });

  if (roots.length === 0) {
    container.innerHTML = '<div class="tree-empty">📭 دستور کاری یافت نشد</div>';
    return;
  }

  function buildNode(node, depth) {
    var type = getNodeType(node.code);
    var icon = getTypeIcon(type);
    var children = childrenMap[node.code] || [];
    var hasChildren = children.length > 0;
    var nodeId = node.code;
    var isExpanded = expandedNodes[nodeId] === true;

    var div = document.createElement('div');
    div.className = 'tree-node type-' + type;

    var header = document.createElement('div');
    header.className = 'tree-header';
    header.style.paddingRight = (12 + depth * 20) + 'px';

    var toggle = document.createElement('span');
    toggle.className = 'tree-toggle ' + (hasChildren ? (isExpanded ? 'open' : '') : 'leaf');
    toggle.textContent = hasChildren ? '▼' : '•';
    toggle.onclick = function(ev) {
      ev.stopPropagation();
      if (!hasChildren) return;
      expandedNodes[nodeId] = !isExpanded;
      renderTree();
    };
    header.appendChild(toggle);

    var iconEl = document.createElement('span');
    iconEl.className = 'tree-icon';
    iconEl.textContent = icon;
    header.appendChild(iconEl);

    var info = document.createElement('div');
    info.className = 'tree-info';

    var codeEl = document.createElement('div');
    codeEl.className = 'tree-code';
    codeEl.textContent = node.code;
    info.appendChild(codeEl);

    var subjEl = document.createElement('div');
    subjEl.className = 'tree-subject';
    subjEl.textContent = node.subject || '—';
    info.appendChild(subjEl);

    var metaEl = document.createElement('div');
    metaEl.className = 'tree-meta';
    if (node.recipient) {
      var rEl = document.createElement('span');
      rEl.textContent = '👤 ' + node.recipient;
      metaEl.appendChild(rEl);
    }
    if (node.startShamsi || node.endShamsi) {
      var dEl = document.createElement('span');
      dEl.textContent = '📅 ' + (node.startShamsi || '') + (node.endShamsi ? ' تا ' + node.endShamsi : '');
      metaEl.appendChild(dEl);
    }
    if (node.status) {
      var sEl = document.createElement('span');
      sEl.textContent = '🔹 ' + node.status;
      metaEl.appendChild(sEl);
    }
    if (hasChildren) {
      var cEl = document.createElement('span');
      cEl.textContent = '📎 ' + children.length + ' زیرمجموعه';
      metaEl.appendChild(cEl);
    }
    info.appendChild(metaEl);

    header.appendChild(info);
    header.onclick = function() { openNodeModal(node); };
    div.appendChild(header);

    if (hasChildren) {
      var chDiv = document.createElement('div');
      chDiv.className = 'tree-children' + (isExpanded ? '' : ' hidden');
      children.sort(function(a, b) { return (a.wbs || '').localeCompare(b.wbs || '', undefined, { numeric: true }); });
      children.forEach(function(child) { chDiv.appendChild(buildNode(child, depth + 1)); });
      div.appendChild(chDiv);
    }

    return div;
  }

  roots.sort(function(a, b) { return (a.wbs || '').localeCompare(b.wbs || '', undefined, { numeric: true }); });
  roots.forEach(function(root) { container.appendChild(buildNode(root, 0)); });
}

// ============ Searchable Select ============
function makeSS(boxId, opt) {
  var box = document.getElementById(boxId);
  box.innerHTML = ''; box.className = 'ss-box';
  var multi = opt.multi === true;
  var opts = (opt.options || []).slice();
  var placeholder = opt.placeholder || 'تایپ کنید...';
  var val = multi ? [] : '';
  var onChange = opt.onChange || null;

  var inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'ss-in'; inp.placeholder = placeholder; inp.autocomplete = 'off';
  box.appendChild(inp);
  var ar = document.createElement('span'); ar.className = 'ss-arrow'; ar.textContent = '▼'; box.appendChild(ar);
  var clr = document.createElement('span'); clr.className = 'ss-clear hidden'; clr.textContent = '✕'; box.appendChild(clr);
  var list = document.createElement('div'); list.className = 'ss-list hidden'; box.appendChild(list);
  var chips = document.createElement('div'); chips.className = 'ss-chips'; box.appendChild(chips);

  function norm(o) { return typeof o === 'string' ? { value: o, label: o } : { value: o.value, label: o.label || o.value }; }
  function objFor(v) { for (var i = 0; i < opts.length; i++) { if (norm(opts[i]).value === v) return norm(opts[i]); } return { value: v, label: v }; }
  function updateClear() { clr.classList.toggle('hidden', multi ? val.length === 0 : !val); }

  function renderList(q) {
    q = String(q || '').toLowerCase().trim();
    list.innerHTML = '';
    var items = [];
    opts.forEach(function(o) {
      o = norm(o);
      if (multi && val.indexOf(o.value) !== -1) return;
      if (!multi && val === o.value && !q) return;
      if (q && o.label.toLowerCase().indexOf(q) === -1 && o.value.toLowerCase().indexOf(q) === -1) return;
      items.push(o);
    });
    if (!items.length) {
      var e = document.createElement('div'); e.className = 'ss-empty';
      e.textContent = opts.length ? 'نتیجه‌ای یافت نشد' : 'گزینه‌ای موجود نیست';
      list.appendChild(e); return;
    }
    items.forEach(function(o) {
      var it = document.createElement('div'); it.className = 'ss-item'; it.textContent = o.label;
      function pick(ev) {
        if (ev) { ev.preventDefault(); ev.stopPropagation(); }
        if (multi) {
          if (val.indexOf(o.value) === -1) val.push(o.value);
          inp.value = ''; renderChips(); renderList(''); updateClear();
          if (onChange) onChange(val.slice());
        } else {
          val = o.value; inp.value = o.label; inp.readOnly = true;
          list.classList.add('hidden'); updateClear();
          if (onChange) onChange(val);
        }
      }
      it.addEventListener('mousedown', pick);
      it.addEventListener('touchstart', pick, { passive: false });
      list.appendChild(it);
    });
  }
  function renderChips() {
    chips.innerHTML = '';
    if (!multi) return;
    val.forEach(function(v) {
      var o = objFor(v);
      var c = document.createElement('span'); c.className = 'ss-chip';
      var t = document.createElement('span'); t.textContent = o.label;
      var x = document.createElement('span'); x.className = 'ss-chip-x'; x.textContent = '×';
      x.onclick = function(ev) {
        ev.stopPropagation();
        val = val.filter(function(s) { return s !== v; });
        renderChips(); renderList(inp.value); updateClear();
        if (onChange) onChange(val.slice());
      };
      c.appendChild(t); c.appendChild(x); chips.appendChild(c);
    });
  }
  clr.onclick = function(ev) {
    ev.stopPropagation();
    val = multi ? [] : '';
    inp.value = ''; inp.readOnly = false;
    renderChips(); renderList(''); updateClear();
    if (onChange) onChange(multi ? [] : '');
  };
  inp.onfocus = function() { if (!inp.readOnly) { list.classList.remove('hidden'); renderList(inp.value); } };
  inp.oninput = function() {
    if (inp.readOnly) return;
    if (!multi && inp.value !== objFor(val).label) { val = ''; updateClear(); if (onChange) onChange(''); }
    list.classList.remove('hidden'); renderList(inp.value);
  };
  document.addEventListener('click', function(e) { if (!box.contains(e.target)) list.classList.add('hidden'); });
  renderList(''); updateClear();

  return {
    getValue: function() { return multi ? val.slice() : val; },
    getStr: function() { return multi ? val.join('\n') : val; },
    getDisplay: function() { return multi ? val.map(function(v) { return objFor(v).label; }).join('، ') : (val ? objFor(val).label : ''); },
    getChatIds: function() {
      if (!multi && val) {
        for (var i = 0; i < recipients.length; i++) {
          if (recipients[i].systemName === val) return { tg: recipients[i].telegramChatId || '', bale: recipients[i].baleChatId || '' };
        }
      }
      return { tg: '', bale: '' };
    },
    setOpts: function(a) { opts = (a || []).slice(); renderList(inp.value); },
    setPh: function(p) { placeholder = p; inp.placeholder = p; }
  };
}

    if (ssAddr) { ssAddr.setOpts(a); ssAddr.setPh(a.length ? 'چندتایی (' + a.length + ')' : 'تایپ'); }
    if (ssRelated) { ssRelated.setOpts(rr); ssRelated.setPh(rr.length ? 'جستجو (' + rr.length + ')' : 'خالی'); }
    optionsDone = true; checkAllDone();
  }).catch(function() { optionsDone = true; checkAllDone(); });
}

function onRecipient(val) {
  var cTg = document.getElementById('chkTg'), cBale = document.getElementById('chkBale'), cAll = document.getElementById('chkAll');
  var rTg = document.getElementById('rowTg'), rBale = document.getElementById('rowBale');
  cTg.checked = false; cBale.checked = false; cAll.checked = false;
  rTg.classList.remove('dis'); rBale.classList.remove('dis');
  cTg.disabled = false; cBale.disabled = false;
  if (!val) return;
  var r = null;
  for (var i = 0; i < recipients.length; i++) if (recipients[i].systemName === val) { r = recipients[i]; break; }
  if (!r) return;
  if (r.telegramChatId) cTg.checked = true; else { cTg.disabled = true; rTg.classList.add('dis'); }
  if (r.baleChatId) cBale.checked = true; else { cBale.disabled = true; rBale.classList.add('dis'); }
  updateAll();
}
function updateAll() {
  var a = document.getElementById('chkAll');
  var on = [];
  if (!document.getElementById('chkTg').disabled) on.push(document.getElementById('chkTg'));
  if (!document.getElementById('chkBale').disabled) on.push(document.getElementById('chkBale'));
  a.checked = on.length > 0 && on.every(function(c) { return c.checked; });
}
document.getElementById('chkAll').onchange = function() {
  var v = this.checked;
  if (!document.getElementById('chkTg').disabled) document.getElementById('chkTg').checked = v;
  if (!document.getElementById('chkBale').disabled) document.getElementById('chkBale').checked = v;
};
document.getElementById('chkTg').onchange = updateAll;
document.getElementById('chkBale').onchange = updateAll;

// ============ Preview ============
document.getElementById('previewBtn').onclick = function() {
  var rec = ssRecipient ? ssRecipient.getStr() : '';
  var sub = ssSubject ? ssSubject.getStr() : '';
  var epc = ssEpc ? ssEpc.getStr() : '';
  var fld = ssField ? ssField.getStr() : '';
  var eng = ssEng ? ssEng.getStr() : '';
  var rel = ssRelated ? ssRelated.getStr() : '';
  var relDisp = ssRelated ? ssRelated.getDisplay() : '';
  var addr = ssAddr ? ssAddr.getStr() : '';
  var addrD = ssAddr ? ssAddr.getDisplay() : '';
  var desc = document.getElementById('woDesc').value.trim();
  var y = document.getElementById('woYear').value;
  var m = document.getElementById('woMonth').value;
  var d = document.getElementById('woDay').value;
  var dur = document.getElementById('woDur').value;
  var sTg = document.getElementById('chkTg').checked;
  var sBale = document.getElementById('chkBale').checked;

  if (!rec) return showMsg('woMsg', '❌ مخاطب را انتخاب کنید', 'err');
  if (!sub) return showMsg('woMsg', '❌ موضوع را انتخاب کنید', 'err');
  if (!desc) return showMsg('woMsg', '❌ شرح عملیات الزامی است', 'err');
  if (!epc) return showMsg('woMsg', '❌ EPC را انتخاب کنید', 'err');
  if (!fld) return showMsg('woMsg', '❌ رشته را انتخاب کنید', 'err');
  if (!eng) return showMsg('woMsg', '❌ پیمانکاری/امانی را انتخاب کنید', 'err');
  if (!rel) return showMsg('woMsg', '❌ ردیف مرتبط را انتخاب کنید', 'err');
  if (!addr) return showMsg('woMsg', '❌ آدرس را انتخاب کنید', 'err');
  if (!dur || parseInt(dur, 10) < 1) return showMsg('woMsg', '❌ مدت معتبر نیست', 'err');
  if (!sTg && !sBale) return showMsg('woMsg', '❌ حداقل یک پلتفورم انتخاب کنید', 'err');
  if (reservedNumbers.length === 0) return showMsg('woMsg', '⏳ چند لحظه صبر کنید و دوباره امتحان کنید', 'err');

  var sY = parseInt(y), sM = parseInt(m), sD = parseInt(d), n = parseInt(dur);
  var sg = j2g(sY, sM, sD);
  var sdt = new Date(sg[0], sg[1]-1, sg[2]);
  var edt = new Date(sdt.getTime() + (n-1)*86400000);
  var ej = g2j(edt.getFullYear(), edt.getMonth()+1, edt.getDate());
  var endSh = ej[0] + '-' + ej[1] + '-' + ej[2];
  var startSh = sY + '-' + sM + '-' + sD;
  var now = new Date();
  var tj = g2j(now.getFullYear(), now.getMonth()+1, now.getDate());
  var todaySh = tj[0] + '-' + tj[1] + '-' + tj[2];
  var dn = WEEKDAYS[now.getDay()];

  var msg =
    'از: دفتر کارگاه پروژه ایگل\n' +
    'به: آقای ' + rec + '\n\n' +
    '#' + epc + ' #' + fld + ' #' + eng + '\n' +
    'موضوع: ' + sub + '\n\n' +
    'ابلاغ شده در تاریخ : #' + todaySh + '  روز ' + dn + '\n' +
    'به آدرس: ' + addrD + '\n\n' +
    ' # ' + desc + '\n' +
    '#برنامه_زمانبندی:\n' +
    'از تاریخ:  ' + startSh + 'تا تاریخ:' + endSh + ' به مدت ' + n + 'روز\n' +
    '***در صورت نیاز به هرگونه مقدمات، تدارکات و مصالح، کنترل موجودی و درخواست به موقع آنها، وظیفه پیمانکار/مسئول محترم می باشد';

  document.getElementById('pvRecipient').innerText = rec;
  var pl = [];
  if (sTg) pl.push('📱 Telegram');
  if (sBale) pl.push('📨 Bale');
  document.getElementById('pvPlatforms').innerText = pl.join(' + ');
  document.getElementById('pvSubject').innerText = sub;
  document.getElementById('pvEpc').innerText = epc;
  document.getElementById('pvField').innerText = fld;
  document.getElementById('pvEng').innerText = eng;
  document.getElementById('pvRelated').innerText = relDisp;
  document.getElementById('pvAddr').innerText = addrD;
  document.getElementById('pvDesc').innerText = desc;
  document.getElementById('pvStart').innerText = startSh;
  document.getElementById('pvDur').innerText = n + ' روز';
  document.getElementById('pvEnd').innerText = endSh;
  document.getElementById('pvMsg').innerText = msg;

  var ci = ssRecipient.getChatIds();
  submitToken = 'req_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
  payload = {
    action: 'createWorkOrder', adminChatId: String(tgUser.id),
    recipientSystemName: rec,
    recipientTelegramChatId: ci.tg,
    recipientBaleChatId: ci.bale,
    sendTelegram: sTg, sendBale: sBale,
    subject: sub, description: desc, epc: epc, field: fld,
    engagementType: eng, address: addr, addressDisplay: addrD,
    relatedRow: rel,
    startYear: y, startMonth: m, startDay: d, duration: dur,
    reservedNumber: reservedNumbers[0],
    submitToken: submitToken,
    _hasTg: !!ci.tg, _hasBale: !!ci.bale
  };

  submitting = false;
  var sb = document.getElementById('submitBtn');
  sb.disabled = false; sb.innerText = '✅ ثبت و ارسال';
  document.getElementById('finalMsg').innerText = '';
  document.getElementById('finalMsg').className = '';
  navigateTo('previewSection');
};

document.getElementById('editBtn').onclick = function() { navigateTo('workOrderSection'); };

// ============ Submit ============
document.getElementById('submitBtn').onclick = function() {
  if (submitting) return;
  submitting = true;
  var b = this;
  b.disabled = true; b.style.pointerEvents = 'none';
  b.innerText = '⏳ در حال ارسال...';
  document.getElementById('editBtn').disabled = true;
  document.getElementById('finalMsg').innerText = '';
  document.getElementById('finalMsg').className = '';
  showGlobalLoader('در حال ثبت و ارسال...');

  api(payload)
    .then(function(r) {
      hideGlobalLoader();
      if (r && r.ok) {
        var finalEl = document.getElementById('finalMsg');
        finalEl.className = 'msg msg-ok';
        finalEl.innerHTML =
          '<div style="text-align:center;font-size:16px;font-weight:bold;">✅ ' + escHtml(r.message || 'ثبت شد') + '</div>' +
          (r.row ? '<div style="text-align:center;font-size:13px;margin-top:4px;">ردیف: ' + r.row + '</div>' : '') +
          (r.code ? '<div style="text-align:center;font-size:14px;margin-top:6px;font-family:monospace;color:#f59e0b;font-weight:bold;">' + escHtml(r.code) + '</div>' : '');
        b.innerText = '✅ ثبت شد';
        b.disabled = true;
        reservedNumbers = [];
        panelLoaded = false;
        reportsLoaded = false;
      } else if (r && r.duplicate) {
        showMsg('finalMsg', '⚠️ ' + r.message, 'err');
        b.innerText = '⚠️ قبلاً ثبت شده';
      } else {
        submitting = false;
        b.disabled = false; b.style.pointerEvents = 'auto';
        b.innerText = '✅ تلاش دوباره';
        showMsg('finalMsg', '❌ ' + ((r && r.message) || 'خطا'), 'err');
      }
      document.getElementById('editBtn').disabled = false;
    })
    .catch(function(err) {
      hideGlobalLoader();
      submitting = false;
      b.disabled = false; b.style.pointerEvents = 'auto';
      b.innerText = '✅ تلاش دوباره';
      document.getElementById('editBtn').disabled = false;
      showMsg('finalMsg', '❌ ' + (err.message || 'خطا'), 'err');
    });
};

// ============ Utility ============
function showMsg(id, text, type) {
  var el = document.getElementById(id);
  if (!el) return;
  el.className = 'msg msg-' + (type || 'info');
  el.innerText = text;
}

// ============ Start ============
init();
</script>
